services:
  dataloader:
    build:
      context: .
      dockerfile: Dockerfile-dataloader
    command: ["python", "src/calculate.py"]
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    environment:
      GITHUB_AUTH_TOKEN: ${GITHUB_AUTH_TOKEN:-}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: pull_requests
      PGUSER: appuser
      PGPASSWORD: apppassword
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: pull_requests
      MONGODB_COLLECTION: pull_request_results

  postgres:
    image: postgres:16
    container_name: pr-analyzer-postgres
    logging:
      driver: "none"
    environment:
      POSTGRES_DB: pull_requests
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d pull_requests"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: pr-analyzer-mongo
    command: mongod --quiet --logpath /dev/null 
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pr-analyzer-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  mongo-express:
    image: mongo-express:latest
    container_name: pr-analyzer-mongo-express
    depends_on:
      mongo:
        condition: service_started
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"

volumes:
  postgres_data:
  mongo_data:
  pgadmin_data:
